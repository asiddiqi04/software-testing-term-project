# Runs the study's test scripts in a pinned Node 22 container, so everyone gets
# the same Node version without installing it locally.
#   docker compose run --rm test
#   docker compose run --rm coverage
x-node: &node
  image: node:22.18.0-bookworm-slim
  working_dir: /app
  volumes:
    - .:/app
    # Keep the container's node_modules separate from any on the host.
    - node_modules:/app/node_modules

services:
  test:
    <<: *node
    command: sh -c "npm ci --no-audit --no-fund && npm test"

  coverage:
    <<: *node
    command: sh -c "npm ci --no-audit --no-fund && npm run coverage"

volumes:
  node_modules:
